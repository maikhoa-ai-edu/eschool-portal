name: Phát hành

# Đẩy tag dạng v1.2.3: chạy đủ kiểm thử, đóng gói từ môi trường sạch, tạo GitHub Release,
# rồi đưa nhánh stable tới đúng bản này. Các website trên Vercel chỉ theo stable, không theo main.
on:
  push:
    tags: ['v*.*.*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Đóng gói và kiểm tra gói
        run: npm run release:build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Tạo GitHub Release
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "eSchool Portal $version" \
            --notes-file release/RELEASE_NOTES.md \
            "release/eschool-portal-$version.zip" \
            release/dist.zip \
            release/install.sql \
            release/HUONG-DAN-CAI-DAT.pdf
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Đưa nhánh stable tới bản vừa phát hành
        run: git push origin "HEAD:refs/heads/stable"
