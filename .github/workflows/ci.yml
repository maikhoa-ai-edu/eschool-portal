name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Kiểm thử install.php (PHP có sẵn trên Ubuntu runner)
        run: php -v && npm run test:php
      - name: Kiểm thử OG, sitemap trên Node và PHP
        run: npm run test:seo
      - run: npm run build

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - run: supabase db start
      - run: supabase test db

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - run: npm ci
      - run: supabase start
      - name: Tải ảnh & văn bản mẫu lên Storage cục bộ
        run: npm run db:seed-storage
      - name: Tạo .env.local từ Supabase cục bộ
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env.local
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Đóng gói bản thử
        run: npm run release:build
      - name: Đưa CSDL về dữ liệu mẫu (E2E trên đã tạo tài khoản trùng với luồng cài đặt)
        run: npm run db:reset
      - name: Kiểm thử gói trên Apache + PHP và luồng cài đặt từ gói
        run: npm run test:package
      - name: Lưu gói bản thử
        uses: actions/upload-artifact@v7
        with:
          name: goi-ban-thu
          path: release/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
